name: Build and Release Apptainer SIF
on:
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.0

      - name: Build SIF from Docker Hub
        # 这里换成了真正的官方镜像地址 katharinahoff/galba-notebook:latest
        run: |
          apptainer pull galba_latest.sif docker://katharinahoff/galba-notebook:latest
          sha256sum galba_latest.sif > galba_latest.sif.sha256

      - name: Release and Upload
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: |
            galba_latest.sif
            galba_latest.sif.sha256
